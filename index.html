<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgilime Özel 💖</title>

<!-- =======================
 KİŞİSELLEŞTİRME ALANI
======================= -->
<script>
const AYARLAR = {
  sevgiliAdi: "CEMREMM",
  anaMesaj: "Sen hayatıma girdiğin günden beri her şey daha güzel 💖",

  askMektubu: `
Canım sevgilim ❤️  
Bu satırları okurken belki yanındayım, belki değilim ama
kalbim her zaman seninle.  
İyi ki varsın, iyi ki benimlesin...
`,

  iliskiBaslangic: "2023-06-14",

  ozelGunler: {
    tanisma: "2023-05-20",
    sevgililer: "2026-06-14",
    dogumGunu: "2001-08-10"
  },

  fotograflar: [
    "sevgili1.png",
    "sevgili2.png",
    "sevgili3.png"
  ]
};
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px;
  text-align:center;
}

h1{font-size:3em}
section{margin:60px 0}

.card{
  background:rgba(255,255,255,0.2);
  padding:25px;
  border-radius:20px;
}

button{
  padding:15px 30px;
  font-size:1.1em;
  border:none;
  border-radius:30px;
  background:#fff;
  color:#ff4d6d;
  cursor:pointer;
  transition:.3s;
}
button:hover{transform:scale(1.05)}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.gallery img{
  width:100%;
  border-radius:20px;
}

.hidden{display:none}

.counter{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}
.counter div{
  min-width:120px;
  padding:15px;
  background:rgba(255,255,255,0.25);
  border-radius:15px;
}
.counter span{
  font-size:2em;
  display:block;
}
</style>
</head>

<body>
<div class="container">

<h1>💖 <span id="isim"></span></h1>
<p id="anaMesaj"></p>

<!-- FOTOĞRAFLAR -->
<section>
<h2>Anılarımız 📸</h2>
<div class="gallery" id="galeri"></div>
</section>

<!-- SÜRPRİZ -->
<section>
<button onclick="surprizAc()">Sürprizi Aç 💝</button>
<div id="surpriz" class="card hidden">
  <h2>Sana Özel 💌</h2>
  <p>Bu site kalbimden sana…</p>
</div>
</section>

<!-- AŞK MEKTUBU -->
<section>
<h2>Aşk Mektubum 💌</h2>
<div class="card">
  <p id="askMektubu"></p>
</div>
</section>

<!-- ÖZEL GÜNLER -->
<section>
<h2>Özel Günlerimiz 📅</h2>

<h3>Tanışma Günümüz ❤️</h3>
<div class="counter" id="tanisma"></div>

<h3>Sevgililer Günü 💘</h3>
<div class="counter" id="sevgililer"></div>

<h3>Doğum Günün 🎂</h3>
<div class="counter" id="dogum"></div>
</section>

</div>

<script>
isim.innerText = AYARLAR.sevgiliAdi;
anaMesaj.innerText = AYARLAR.anaMesaj;
askMektubu.innerText = AYARLAR.askMektubu;

AYARLAR.fotograflar.forEach(f=>{
  const img=document.createElement("img");
  img.src=f;
  galeri.appendChild(img);
});

function surprizAc(){
  document.getElementById("surpriz").classList.remove("hidden");
}

function sayac(tarih,alan){
  const hedef=new Date(tarih);
  function guncelle(){
    const fark=hedef-new Date();
    if(fark<0)return;
    const g=Math.floor(fark/86400000);
    const s=Math.floor((fark/3600000)%24);
    const d=Math.floor((fark/60000)%60);
    alan.innerHTML=`
      <div><span>${g}</span>Gün</div>
      <div><span>${s}</span>Saat</div>
      <div><span>${d}</span>Dakika</div>`;
  }
  setInterval(guncelle,1000);
  guncelle();
}

sayac(AYARLAR.ozelGunler.tanisma, tanisma);
sayac(AYARLAR.ozelGunler.sevgililer, sevgililer);
sayac(AYARLAR.ozelGunler.dogumGunu, dogum);
</script>

</body>
</html>
